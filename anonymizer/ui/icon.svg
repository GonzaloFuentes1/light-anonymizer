<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The app's icon: a page with two lines redacted and the leak check's seal, on the app's blue.
       packaging/icon.ico is rendered from this file (see packaging/light_anonymizer.spec). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3D6AD6"/>
      <stop offset="1" stop-color="#1A2F6E"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EEFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B1430" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <g filter="url(#shadow)">
    <path d="M70 40 H150 L190 80 V206 a12 12 0 0 1 -12 12 H70 a12 12 0 0 1 -12 -12 V52 a12 12 0 0 1 12 -12 Z" fill="url(#sheet)"/>
  </g>
  <path d="M150 40 V68 a12 12 0 0 0 12 12 H190 Z" fill="#B9C8EC"/>
  <rect x="80" y="70" width="52" height="11" rx="5.5" fill="#A7B5D3"/>
  <rect x="80" y="100" width="92" height="22" rx="4" fill="#111827"/>
  <rect x="80" y="136" width="70" height="11" rx="5.5" fill="#A7B5D3"/>
  <rect x="80" y="160" width="58" height="22" rx="4" fill="#111827"/>
  <circle cx="186" cy="190" r="38" fill="#FFD23F" stroke="#1A2F6E" stroke-width="9"/>
  <path d="M168 191 L181 204 L205 177" fill="none" stroke="#1A2F6E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
