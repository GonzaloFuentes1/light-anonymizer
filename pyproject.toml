[project]
name = "light-anonymizer"
version = "0.1.0"
description = "Local anonymizer for documents and images (CoP 33 / SmartGORE)"
authors = [{ name = "Gonzalo Fuentes", email = "gonzalo.fuentes@cenia.cl" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2,<1.29",  # strokes.py uses private bindings: check them (self_test) before raising this
    "python-multipart>=0.0.32",
    "pywebview>=6.2.1",
    "rapidocr>=3.9.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
data = [
    "matplotlib>=3.11.2",
    "piexif>=1.1.3",
    "pypdfium2>=5.13.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "anonymizer"
module-root = ""

[tool.ruff]
target-version = "py311"
line-length = 120
# Plans and notes: their Markdown code blocks are quotes, not code to reformat.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: end-to-end tests with the real models (OCR and faces), about a minute"]

[tool.uv]
# rapidocr requires opencv-python with a GUI (Qt, FFmpeg); the headless build is used instead.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
